[project]
name = "regulador-acueducto"
version = "1.1.0"
description = "Regulador dinámico de flujo y presión en una red de acueducto (simulación híbrida EDO + eventos discretos)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dash>=2.18,<4",
    "plotly>=5.20",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Aplicación, no librería: uv no instala el proyecto, solo sus dependencias.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
